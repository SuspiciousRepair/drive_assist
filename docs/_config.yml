title: Drive Assist
description: An everyday dashboard for the Geely EX2 / Geometry E.
url: "https://suspiciousrepair.github.io"
baseurl: "/drive_assist"
lang: en
timezone: America/Sao_Paulo
markdown: kramdown
theme: null
plugins:
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
