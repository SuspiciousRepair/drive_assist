---
layout: default
---
<article class="post">
  <p class="eyebrow">{% if page.locale == 'pt-BR' %}Diário de desenvolvimento{% else %}Development journal{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.author %} · {{ page.author }}{% endif %}</p>
  {{ content }}
</article>
