# /share/nginx_proxy/mqtt-ws.conf
#
# Expõe o Mosquitto (MQTT sobre WebSocket) num path do mesmo host que já é
# publicado pelo Funnel do Tailscale.
#
# Por que isto é necessário:
#   - o carro (head unit Geely) NÃO roda cliente Tailscale — o ROM não tem
#     com.android.vpndialogs, então qualquer app de VPN morre com
#     ActivityNotFoundException;
#   - a rede de casa está atrás de CGNAT, logo não há porta aberta para o
#     NGINX receber conexões diretas;
#   - o add-on Tailscale só sabe expor o próprio Home Assistant
#     (share_homeassistant), sem backend configurável.
#
# O app do carro (Drive Assist) conecta em wss://<host>:8443/mqtt quando está fora, e
# cai de volta para tcp://<lan-broker-ip>:1883 em casa — a lista de endereços do
# app tenta em ordem e o Paho refaz esse percurso a cada reconexão.

server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # MQTT sobre WebSocket -> add-on Mosquitto (porta 1884 = ws, já ativa)
    location /mqtt {
        proxy_pass http://core-mosquitto:1884;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # MQTT fica ocioso entre publicações (o carro publica a cada 30s).
        # Sem estes timeouts o proxy derruba a conexão no meio do keepalive,
        # e o cliente entra em ciclo de reconexão.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # todo o resto continua indo para o Home Assistant
    location / {
        proxy_pass http://homeassistant:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
