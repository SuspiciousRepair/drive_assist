name: Build Drive Assist APKs

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-28 platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Export Android SDK Environment
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Verify Android Toolchain
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-28/android.jar" || { echo "Missing android-28"; exit 1; }
          test -f "$ANDROID_HOME/platforms/android-34/android.jar" || { echo "Missing android-34"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" || { echo "Missing aapt2"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/34.0.0/d8" || { echo "Missing d8"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign" || { echo "Missing zipalign"; exit 1; }
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" || { echo "Missing apksigner"; exit 1; }
          echo "All required Android SDK tools and platforms verified successfully."


      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/debug.ks
          fi
          echo "KS=$GITHUB_WORKSPACE/keystore/debug.ks" >> $GITHUB_ENV

      - name: Ensure car-stubs
        run: |
          if [ ! -f car-stubs/car-stubs.jar ]; then
            echo "Compiling car-stubs.jar..."
            mkdir -p car-stubs/out
            javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-28/android.jar" -d car-stubs/out $(find car-stubs/android -name '*.java')
            jar cf car-stubs/car-stubs.jar -C car-stubs/out .
            rm -rf car-stubs/out
          fi
          test -f car-stubs/car-stubs.jar || { echo "car-stubs.jar missing!"; exit 1; }
          echo "car-stubs.jar ready ($(stat -c%s car-stubs/car-stubs.jar) bytes)."

      - name: Build modehelper
        run: |
          chmod +x modehelper/build-modehelper.sh
          ./modehelper/build-modehelper.sh

      - name: Build Drive Assist APK
        run: |
          chmod +x gradlew
          ./gradlew :drivemem:assembleRelease --no-daemon
          if [ -f drivemem/build/outputs/apk/release/drive_assist.apk ]; then
            cp drivemem/build/outputs/apk/release/drive_assist.apk drive_assist.apk
          elif [ -f drivemem/build/outputs/apk/release/drivemem-release.apk ]; then
            cp drivemem/build/outputs/apk/release/drivemem-release.apk drive_assist.apk
          fi
          test -f drive_assist.apk || { echo "drive_assist.apk missing!"; exit 1; }

      - name: Build All-in-One Installer APK
        run: |
          chmod +x installer/build-installer.sh
          ./installer/build-installer.sh

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum drive_assist.apk drive_assist_installer.apk modehelper/modehelper.apk > SHA256SUMS
          echo "### 🔒 Build Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat SHA256SUMS | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drive-assist-apks
          path: |
            drive_assist.apk
            drive_assist_installer.apk
            modehelper/modehelper.apk
            SHA256SUMS

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            drive_assist.apk
            drive_assist_installer.apk
            modehelper/modehelper.apk
            SHA256SUMS
          generate_release_notes: true
